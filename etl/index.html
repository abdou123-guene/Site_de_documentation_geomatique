<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chaîne ETL – pente et dévers (interactif)</title>
<style>
:root{
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --bg:#f3f6fa;--panel:#ffffff;--card:#ffffff;--text:#1e293b;--muted:#64748b;--line:#94a3b8;--border:#d5dde8;--shadow:rgba(15,23,42,.14);
  --navy:#10243e;
  --A:#0e9aa7;--Atint:#e3f5f7;--Adark:#09646d;
  --B:#7c4ddb;--Btint:#f0eafc;--Bdark:#4b2a9a;
  --blue:#2f6fde;--bluetint:#e8f0fd;--bluedark:#1b4aa3;
  --amber:#e8a317;--ambertint:#fdf3dc;--amberdark:#7a5200;
  --coral:#e4572e;--coraltint:#fceae4;--coraldark:#9a2e10;
  --band:#cbd5e1;
}
html[data-theme="dark"]{
  --bg:#0d1117;--panel:#161b22;--card:#1c232d;--text:#e6edf3;--muted:#9aa7b5;--line:#6b7686;--border:#2f3a48;--shadow:rgba(0,0,0,.55);
  --Atint:#0f3a40;--Adark:#6fd6e0;--Btint:#2a1f4d;--Bdark:#c4adff;
  --bluetint:#14264a;--bluedark:#9db9f5;--ambertint:#3a2c0b;--amberdark:#f3c76a;--coraltint:#40201a;--coraldark:#f5a58f;
  --band:#3b4654;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 14px;background:var(--navy);color:#fff}
header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px}
header .sub{font-size:12px;color:#b8c7dc}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-left:auto}
button,input[type=search]{font:inherit;font-size:13px}
button{background:#1c3556;color:#fff;border:1px solid #2c4a73;border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{background:#27487a}
button:focus-visible,input:focus-visible,.node:focus-visible{outline:3px solid #f5c542;outline-offset:2px}
input[type=search]{padding:6px 10px;border-radius:8px;border:1px solid #2c4a73;background:#0e1d33;color:#fff;width:150px}
input[type=search]::placeholder{color:#8ea5c4}
label.chk{display:flex;gap:5px;align-items:center;font-size:12px;color:#d6e2f2;cursor:pointer}
main{flex:1;display:flex;min-height:0;position:relative}
#stage{flex:1;min-width:0;position:relative}
svg#canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:var(--bg);user-select:none;-webkit-user-select:none}
svg#canvas.panning{cursor:grabbing}
aside{width:350px;max-width:42vw;background:var(--panel);border-left:1px solid var(--border);overflow:auto;padding:14px 16px;font-size:13.5px;line-height:1.45}
aside h2{font-size:17px;margin:0 0 4px}
aside h3{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:16px 0 6px}
aside .badge{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;color:#fff;margin-bottom:6px}
aside code,aside pre{font-family:var(--mono);font-size:12px}
aside pre{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;white-space:pre-wrap;word-break:break-word;margin:4px 0}
aside table{border-collapse:collapse;width:100%}
aside td{vertical-align:top;padding:4px 0;border-bottom:1px solid var(--border)}
aside td:first-child{color:var(--muted);width:42%;padding-right:8px}
aside a.lk{color:var(--bluedark);cursor:pointer;text-decoration:underline}
aside ul{padding-left:18px;margin:4px 0}
aside .close{float:right;background:transparent;color:var(--muted);border:1px solid var(--border)}
.legend-line{display:flex;align-items:center;gap:8px;margin:4px 0}
.legend-line svg{flex:none}
/* ---- éléments du schéma ---- */
.band{fill:none;stroke:var(--band);stroke-width:1.5;stroke-dasharray:6 6}
.band.lane{stroke-dasharray:none;stroke-width:1.6}
.band-label{font:700 15px var(--sans)}
.shadow{fill:var(--shadow)}
.card{fill:var(--card);stroke-width:2}
.node{cursor:grab}
.node:focus{outline:none}
.node.dragging{cursor:grabbing}
.node.dim,.edge.dim,.band-g.dim{opacity:.16}
.node.sel .card{stroke-width:3.6}
.node.found .card{stroke-width:3.6}
.hidden{display:none}
.t-title{font:700 17px var(--sans);fill:var(--text)}
.t-tag{font:700 12px var(--sans)}
.t-line{font:13px var(--sans);fill:var(--text)}
.t-mono{font:12px var(--mono);fill:var(--text)}
.t-muted{font:13px var(--sans);fill:var(--muted)}
.t-num{font:700 13px var(--sans);fill:#fff}
.t-chip{font:700 12px var(--sans)}
.t-white{fill:#fff}
.t-label{font:700 11.5px var(--sans)}
.edge{fill:none;stroke-width:2.2;opacity:.8}
.edge.d-join{stroke-dasharray:9 5}
.edge.d-raster{stroke-dasharray:2 5;stroke-linecap:round}
.faint .edge.from-input{opacity:.32}
.edge.hl{opacity:1;stroke-width:3.4}
.edge.hover{opacity:1;stroke-width:3.4}
.edge-label rect{fill:var(--panel);stroke:var(--border)}
.edge-label text{font:600 11px var(--sans);fill:var(--text)}
@media (max-width:820px){
  aside{position:absolute;left:0;right:0;bottom:0;width:auto;max-width:none;max-height:46%;border-left:none;border-top:1px solid var(--border);box-shadow:0 -6px 18px var(--shadow)}
  header h1{font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <div><h1>Chaîne ETL · pente longitudinale et dévers à partir du MNT</h1><div class="sub" id="sub"></div></div>
  <div class="tools" role="toolbar" aria-label="Outils d'affichage">
    <input type="search" id="search" placeholder="Rechercher…" aria-label="Rechercher une étape">
    <label class="chk"><input type="checkbox" id="chkA" checked> Voie A</label>
    <label class="chk"><input type="checkbox" id="chkB" checked> Voie B</label>
    <label class="chk" title="Atténuer les liens qui partent des couches d'entrée"><input type="checkbox" id="chkFaint" checked> Atténuer les liens d'entrée</label>
    <button id="bFit" title="Ajuster à l'écran (touche F)">Ajuster</button>
    <button id="bIn" title="Zoom avant" aria-label="Zoom avant">+</button>
    <button id="bOut" title="Zoom arrière" aria-label="Zoom arrière">−</button>
    <button id="bReset" title="Revenir à la disposition d'origine">Réinitialiser</button>
    <button id="bSvg" title="Exporter l'affichage en SVG">SVG</button>
    <button id="bPng" title="Exporter l'affichage en PNG">PNG</button>
    <button id="bTheme" title="Thème clair / sombre">Thème</button>
  </div>
</header>
<main>
  <div id="stage">
    <svg id="canvas" role="group" aria-label="Schéma interactif de la chaîne ETL. Faites glisser pour déplacer, molette pour zoomer, cliquez sur une étape pour voir ses détails.">
      <defs id="defs"></defs>
      <g id="viewport"><g id="bands"></g><g id="edges"></g><g id="nodes"></g><g id="labels"></g></g>
    </svg>
    <noscript><p style="padding:20px">Cette page nécessite JavaScript. Une image statique du schéma est disponible dans le dépôt : <code>ETL_pente_devers_MNT.png</code>.</p></noscript>
  </div>
  <aside id="panel" aria-live="polite"></aside>
</main>

/* ---------- données ---------- */

const inE = new Map(), outE = new Map();
nodes.forEach((_, id) => { inE.set(id, []); outE.set(id, []); });

/* ---------- dessin d'un nœud ---------- */

  g.insertBefore(chip, chipT);
  const tri = el('path', {d:`M25 ${cy-5} L25 ${cy+5} L33 ${cy} Z`, fill:c}, g);
  g.insertBefore(tri, chipT);

    const b = txt(g, 't-label', 0, 0, n.badge.t);
    const bw = b.getComputedTextLength() + 22, bc = 'var(--'+COLORS[n.badge.c]+')';
    const r = el('rect', {x:n.w-14-bw, y:-11, width:bw, height:22, rx:11, fill:bc}, g);
    b.setAttribute('x', n.w-14-bw+11); b.setAttribute('y', 4); b.style.fill = n.badge.c === 'amber' ? '#3b2a00' : '#fff';
    g.insertBefore(r, b);
  }
}

nodes.forEach(n => n.g.setAttribute('transform', `translate(${n.x} ${n.y})`));

/* ---------- liens ---------- */
function portY(e, n){
  const ins = inE.get(n.id);
  if (ins.length < 2) return n.y + n.h/2;
  return n.y + n.h * (e.port === 'INPUT' ? 0.36 : 0.68);
}
function edgeGeom(e){
  const s = nodes.get(e.from), t = nodes.get(e.to);
  const x1 = s.x + s.w, y1 = s.y + s.h/2, x2 = t.x, y2 = portY(e, t);
  const dx = Math.max(70, Math.abs(x2 - x1) * 0.42);
  return {x1, y1, x2, y2, c1x:x1+dx, c1y:y1, c2x:x2-dx, c2y:y2};
}
function edgeD(g){ return `M${g.x1} ${g.y1} C${g.c1x} ${g.c1y} ${g.c2x} ${g.c2y} ${g.x2-2} ${g.y2}`; }
edges.forEach(e => {
  const s = nodes.get(e.from), t = nodes.get(e.to);
  const col = s.kind === 'input' ? s.color : t.color;
  e.color = col;

  e.p.setAttribute('d', edgeD(edgeGeom(e)));
});
function updateEdgesOf(id){ [...inE.get(id), ...outE.get(id)].forEach(e => e.p.setAttribute('d', edgeD(edgeGeom(e)))); }

/* ---------- bandes (groupes) ---------- */
const GROUPS = [
  {key:'E', test:n => n.kind === 'input', label:'1 · EXTRACT', color:null},
  {key:'A', test:n => n.lane === 'A' && n.kind === 'alg', label:'VOIE A · Pente longitudinale (sens du déplacement)', color:'A'},
  {key:'B', test:n => n.lane === 'B' && n.kind === 'alg', label:'VOIE B · Dévers (perpendiculaire au déplacement)', color:'B'},
  {key:'L1', test:n => n.id === 'out_pente', label:'3 · LOAD', color:null},
  {key:'L2', test:n => n.id === 'out_devers', label:'3 · LOAD', color:null},

GROUPS.forEach(gr => {
  gr.g = el('g', {class:'band-g'}, gB);
  gr.r = el('rect', {class:'band ' + (gr.color ? 'lane' : ''), rx:18}, gr.g);
  if (gr.color){ gr.r.setAttribute('fill', 'var(--'+gr.color+'tint)'); gr.r.setAttribute('stroke', 'var(--'+gr.color+')'); }
  gr.t = txt(gr.g, 'band-label', 0, 0, gr.label);
  gr.t.style.fill = gr.color ? 'var(--'+gr.color+'dark)' : 'var(--muted)';
});
function updateBands(){
  GROUPS.forEach(gr => {
    const ns = [...nodes.values()].filter(n => gr.test(n) && n.visible);
    if (!ns.length){ gr.g.classList.add('hidden'); return; }
    gr.g.classList.remove('hidden');
    const pad = 26, top = 34;
    const x0 = Math.min(...ns.map(n => n.x)) - pad, y0 = Math.min(...ns.map(n => n.y)) - pad - top + 8;
    const x1 = Math.max(...ns.map(n => n.x + n.w)) + pad, y1 = Math.max(...ns.map(n => n.y + n.h)) + pad;
    gr.r.setAttribute('x', x0); gr.r.setAttribute('y', y0); gr.r.setAttribute('width', x1 - x0); gr.r.setAttribute('height', y1 - y0);
    gr.t.setAttribute('x', x0 + 16); gr.t.setAttribute('y', y0 + 25);
  });
}
updateBands();

/* ---------- transformation (zoom / déplacement) ---------- */
let tx = 0, ty = 0, k = 1;
const KMIN = 0.12, KMAX = 2.6;

function bboxVisible(ids){

  return {x0,y0,x1,y1};
}

  const b = bboxVisible(ids), r = svg.getBoundingClientRect(), pad = ids ? 80 : 70;
  const w = b.x1 - b.x0 + pad*2, h = b.y1 - b.y0 + pad*2;
  k = Math.min(KMAX, Math.max(KMIN, Math.min(r.width / w, r.height / h)));
  tx = (r.width - (b.x1 - b.x0)*k)/2 - b.x0*k; ty = (r.height - (b.y1 - b.y0)*k)/2 - b.y0*k; applyT();
}

}

/* ---------- sélection, lignée, panneau ---------- */

function lineage(id){

  (function up(i){ inE.get(i).forEach(e => { if (!A.has(e.from)){ A.add(e.from); up(e.from); } }); })(id);
  (function down(i){ outE.get(i).forEach(e => { if (!D.has(e.to)){ D.add(e.to); down(e.to); } }); })(id);
  return {A, D};
}
function clearLabels(){ while (gL.firstChild) gL.removeChild(gL.firstChild); }
function refreshStyle(){
  clearLabels();
  let keep = null, hlEdges = new Set();
  if (selected){
    const {A, D} = lineage(selected);
    keep = new Set([selected, ...A, ...D]);
    edges.forEach(e => {
      const a = e.from === selected || A.has(e.from), b = e.to === selected || A.has(e.to);
      const c = e.from === selected || D.has(e.from), d = e.to === selected || D.has(e.to);
      if ((a && b) || (c && d)) hlEdges.add(e.i);
    });
  } else if (query){
    keep = new Set([...nodes.values()].filter(n => n.search.includes(query)).map(n => n.id));
  }
  nodes.forEach(n => {
    n.g.classList.toggle('dim', !!keep && !keep.has(n.id));
    n.g.classList.toggle('sel', n.id === selected);
    n.g.classList.toggle('found', !selected && !!query && keep.has(n.id));
  });
  edges.forEach(e => {
    const on = !keep || hlEdges.has(e.i) || (!selected && keep.has(e.from) && keep.has(e.to));
    e.p.classList.toggle('dim', !!keep && !on);
    e.p.classList.toggle('hl', !!selected && hlEdges.has(e.i));
  });

    <li><b>Déplacer une étape</b> : faites glisser sa carte ; les liens suivent. La disposition est mémorisée dans votre navigateur.</li>
    <li><b>Voir le détail</b> : cliquez sur une étape. Tout ce qui l’alimente et tout ce qu’elle alimente reste en couleur, le reste s’estompe.</li>
    <li><b>Au clavier</b> : Tab pour passer d’une étape à l’autre, Entrée pour la sélectionner, Échap pour désélectionner, F pour tout afficher.</li>
  </ul>
  <h3>Légende des liens</h3>
  <div class="legend-line"><svg width="46" height="10"><line x1="2" y1="5" x2="44" y2="5" stroke="currentColor" stroke-width="2.4"/></svg> flux principal (entrée du traitement)</div>
  <div class="legend-line"><svg width="46" height="10"><line x1="2" y1="5" x2="44" y2="5" stroke="currentColor" stroke-width="2.4" stroke-dasharray="9 5"/></svg> table jointe (jointure)</div>
  <div class="legend-line"><svg width="46" height="10"><line x1="2" y1="5" x2="44" y2="5" stroke="currentColor" stroke-width="2.4" stroke-dasharray="2 5" stroke-linecap="round"/></svg> raster (MNT)</div>
  <h3>À propos</h3>
  <p>Schéma généré à partir du modèle QGIS (<code>.model3</code>). Chaque carte correspond à un traitement du modeleur graphique ; la pastille indique la couche qu’il produit.</p>`;
function renderPanel(){
  if (!selected){ panel.innerHTML = HOWTO; return; }
  const n = nodes.get(selected);
  const col = 'var(--'+COLORS[n.color]+')';
  const kindLabel = n.kind === 'input' ? 'Entrée du modèle' : n.kind === 'output' ? 'Couche finale' : 'Traitement ' + n.stepLabel;
  let h = `<button class="close" id="pClose" aria-label="Fermer le détail">✕</button><span class="badge" style="background:${col}">${esc(kindLabel)}</span><h2>${esc(n.title)}</h2>`;
  if (n.algo) h += `<div style="color:var(--muted);font-size:12px">${esc(n.tag)} · <code>${esc(n.algo)}</code></div>`;
  if (n.text) h += `<p>${esc(n.text)}</p>`;
  if (n.params && n.params.length){
    h += '<h3>Paramètres du modèle</h3><table>';
    n.params.forEach(p => { h += `<tr><td>${esc(p.label)}</td><td>${p.pre ? '<pre>'+esc(p.value)+'</pre>' : (p.mono ? '<code>'+esc(p.value)+'</code>' : esc(p.value))}</td></tr>`; });
    h += '</table>';
  }
  const ins = inE.get(n.id), outs = outE.get(n.id);
  if (ins.length){ h += '<h3>Alimenté par</h3><ul>' + ins.map(e => `<li><a class="lk" data-go="${esc(e.from)}">${esc(nodes.get(e.from).title)}</a> <span style="color:var(--muted)">(${esc(PORTLABEL[e.port]||e.port)})</span></li>`).join('') + '</ul>'; }
  if (outs.length){ h += '<h3>Alimente</h3><ul>' + outs.map(e => `<li><a class="lk" data-go="${esc(e.to)}">${esc(nodes.get(e.to).title)}</a></li>`).join('') + '</ul>'; }
  panel.innerHTML = h;
  const c = $('pClose'); if (c) c.onclick = () => select(null);
  panel.querySelectorAll('[data-go]').forEach(a => a.onclick = () => select(a.getAttribute('data-go'), true));
}
nodes.forEach(n => { n.stepLabel = n.step ? (n.lane + n.step) : ''; n.search = (n.title + ' ' + (n.tag||'') + ' ' + (n.chip||'') + ' ' + (n.algo||'') + ' ' + (n.text||'') + ' ' + (n.params||[]).map(p => p.label + ' ' + p.value).join(' ')).toLowerCase(); });

/* ---------- interactions souris, tactile, clavier ---------- */
const ptrs = new Map(); let mode = null, drag = null, pan = null, pinch = null, moved = 0;
svg.addEventListener('pointerdown', ev => {
  if (ev.button && ev.button !== 0) return;
  svg.setPointerCapture(ev.pointerId); ptrs.set(ev.pointerId, {x:ev.clientX, y:ev.clientY}); moved = 0;
  if (ptrs.size === 2){
    const [a, b] = [...ptrs.values()]; pinch = {d:Math.hypot(a.x-b.x, a.y-b.y)}; mode = 'pinch'; drag = null; pan = null; return;
  }
  const nodeEl = ev.target.closest('.node');
  if (nodeEl){
    const n = nodes.get(nodeEl.getAttribute('data-id')), w = toWorld(ev.clientX, ev.clientY);
    drag = {n, dx:w.x - n.x, dy:w.y - n.y}; mode = 'node'; return;
  }
  pan = {x:ev.clientX, y:ev.clientY, tx, ty}; mode = 'pan'; svg.classList.add('panning');
});
svg.addEventListener('pointermove', ev => {
  if (!ptrs.has(ev.pointerId)) return;
  const prev = ptrs.get(ev.pointerId); moved += Math.abs(ev.clientX - prev.x) + Math.abs(ev.clientY - prev.y);
  ptrs.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});
  if (mode === 'pinch' && ptrs.size >= 2){
    const [a, b] = [...ptrs.values()], d = Math.hypot(a.x-b.x, a.y-b.y);
    if (pinch.d > 0) zoomAt((a.x+b.x)/2, (a.y+b.y)/2, d / pinch.d); pinch.d = d; return;
  }
  if (mode === 'node' && drag){
    if (moved < 4) return;
    const w = toWorld(ev.clientX, ev.clientY);
    drag.n.x = Math.round(w.x - drag.dx); drag.n.y = Math.round(w.y - drag.dy);
    drag.n.g.setAttribute('transform', `translate(${drag.n.x} ${drag.n.y})`); drag.n.g.classList.add('dragging');
    updateEdgesOf(drag.n.id); updateBands();
    if (selected) refreshStyle();
  } else if (mode === 'pan' && pan){
    tx = pan.tx + (ev.clientX - pan.x); ty = pan.ty + (ev.clientY - pan.y); applyT();
  }
});
function endPtr(ev){
  if (!ptrs.has(ev.pointerId)) return;
  ptrs.delete(ev.pointerId);
  const wasClick = moved < 4;
  if (mode === 'node' && drag){
    drag.n.g.classList.remove('dragging');
    if (wasClick) select(selected === drag.n.id ? null : drag.n.id); else saveLayout();
  } else if (mode === 'pan' && wasClick && ev.type === 'pointerup'){ select(null); }
  svg.classList.remove('panning');
  if (ptrs.size < 2) pinch = null;
  if (ptrs.size === 0){ mode = null; drag = null; pan = null; }
}
svg.addEventListener('pointerup', endPtr); svg.addEventListener('pointercancel', endPtr);
svg.addEventListener('wheel', ev => { ev.preventDefault(); zoomAt(ev.clientX, ev.clientY, Math.exp(-ev.deltaY * (ev.ctrlKey ? 0.01 : 0.0015))); }, {passive:false});
nodes.forEach(n => n.g.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); select(selected === n.id ? null : n.id); } }));
nodes.forEach(n => {
  n.g.addEventListener('mouseenter', () => [...inE.get(n.id), ...outE.get(n.id)].forEach(e => e.p.classList.add('hover')));
  n.g.addEventListener('mouseleave', () => edges.forEach(e => e.p.classList.remove('hover')));
});
document.addEventListener('keydown', ev => {
  if (ev.target && ev.target.tagName === 'INPUT') return;
  if (ev.key === 'Escape') select(null);
  if (ev.key === 'f' || ev.key === 'F') fit();
});

/* ---------- boutons ---------- */
function saveLayout(){ try { const o = {}; nodes.forEach(n => { if (n.x !== n.ox || n.y !== n.oy) o[n.id] = [n.x, n.y]; }); if (Object.keys(o).length) localStorage.setItem(LS_KEY, JSON.stringify(o)); else localStorage.removeItem(LS_KEY); } catch(e){} }
$('bFit').onclick = () => fit();
$('bIn').onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(r.left + r.width/2, r.top + r.height/2, 1.25); };
$('bOut').onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(r.left + r.width/2, r.top + r.height/2, 0.8); };
$('bReset').onclick = () => { nodes.forEach(n => { n.x = n.ox; n.y = n.oy; n.g.setAttribute('transform', `translate(${n.x} ${n.y})`); }); edges.forEach(e => e.p.setAttribute('d', edgeD(edgeGeom(e)))); updateBands(); saveLayout(); refreshStyle(); fit(); };
$('search').addEventListener('input', ev => { query = ev.target.value.trim().toLowerCase(); if (query && selected) { selected = null; renderPanel(); } refreshStyle(); });
function applyVisibility(){
  const a = $('chkA').checked, b = $('chkB').checked;
  nodes.forEach(n => { n.visible = !(n.lane === 'A' && n.kind === 'alg' && !a) && !(n.lane === 'B' && n.kind === 'alg' && !b) && !(n.kind === 'output' && ((n.lane === 'A' && !a) || (n.lane === 'B' && !b))); n.g.classList.toggle('hidden', !n.visible); });
  edges.forEach(e => e.p.classList.toggle('hidden', !(nodes.get(e.from).visible && nodes.get(e.to).visible)));
  if (selected && !nodes.get(selected).visible) selected = null;
  updateBands(); refreshStyle(); renderPanel();
}
$('chkA').onchange = $('chkB').onchange = applyVisibility;
$('chkFaint').onchange = ev => svg.classList.toggle('faint', ev.target.checked);
svg.classList.add('faint');
function setTheme(t){ document.documentElement.setAttribute('data-theme', t); try { localStorage.setItem('etl-theme', t); } catch(e){} }
let th = null; try { th = localStorage.getItem('etl-theme'); } catch(e){}
setTheme(th || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('bTheme').onclick = () => setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');

/* ---------- export SVG / PNG ---------- */
function cssText(){
  const rs = getComputedStyle(document.documentElement), out = [];
  for (const sh of document.styleSheets){ try { for (const r of sh.cssRules){ if (r.selectorText && /^(\.|svg|\.faint)/.test(r.selectorText) && !/aside|header|button|label/.test(r.selectorText)) out.push(r.cssText); } } catch(e){} }
  return out.join('\n').replace(/var\((--[a-z0-9-]+)\)/gi, (_, v) => rs.getPropertyValue(v).trim() || '#888').replace(/var\(--sans\)/g, 'sans-serif');
}
function buildSvg(){
  const b = bboxVisible(), pad = 70, x0 = b.x0 - pad, y0 = b.y0 - pad, w = b.x1 - b.x0 + pad*2, h = b.y1 - b.y0 + pad*2;
  const rs = getComputedStyle(document.documentElement);
  const clone = vp.cloneNode(true); clone.removeAttribute('transform');
  clone.querySelectorAll('#labels').forEach(l => l.innerHTML = '');
  let inner = clone.outerHTML.replace(/var\((--[a-z0-9-]+)\)/gi, (_, v) => rs.getPropertyValue(v).trim() || '#888');
  const d = defs.innerHTML.replace(/var\((--[a-z0-9-]+)\)/gi, (_, v) => rs.getPropertyValue(v).trim() || '#888');
  const font = rs.getPropertyValue('--sans').trim(), mono = rs.getPropertyValue('--mono').trim();
  const css = cssText().replace(/var\(--mono\)/g, mono).split('system-ui').join('system-ui');
  return {w, h, str: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${x0} ${y0} ${w} ${h}" width="${w}" height="${h}"><style>${css.replace(/\b(font:[^;]*?)var\(--sans\)/g, '$1sans-serif')}</style><defs>${d}</defs><rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="${rs.getPropertyValue('--bg').trim()}"/>${inner}</svg>`};
}
function download(blob, name){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
$('bSvg').onclick = () => download(new Blob([buildSvg().str], {type:'image/svg+xml'}), 'etl_pente_devers.svg');
$('bPng').onclick = () => {
  const s = buildSvg(), img = new Image(), sc = 2;
  img.onload = () => { const c = document.createElement('canvas'); c.width = s.w*sc; c.height = s.h*sc; const x = c.getContext('2d'); x.scale(sc, sc); x.drawImage(img, 0, 0, s.w, s.h); c.toBlob(b => download(b, 'etl_pente_devers.png'), 'image/png'); };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s.str);
};

/* ---------- démarrage ---------- */
renderPanel(); fit();
window.addEventListener('resize', () => { if (!selected) fit(); });
window.__etl = {nodes, edges, select, fit};
})();
</script>
</body>
</html>
